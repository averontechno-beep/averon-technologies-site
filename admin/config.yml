backend:
  name: github
  repo: averontechno-beep/averon-technologies-site
  branch: main
  base_url: https://averon-cms-auth-proxy.vercel.app
  auth_endpoint: api/auth

media_folder: "assets/photos"
public_folder: "assets/photos"

collections:
  - name: "contenu"
    label: "Contenu du site"
    files:
      - file: "content/data.json"
        label: "Textes et coordonnées"
        name: "data"
        fields:
          - { label: "Accroche (au-dessus du titre)", name: "hero_kicker", widget: "string" }
          - { label: "Titre principal", name: "hero_title", widget: "string" }
          - { label: "Sous-titre", name: "hero_subtitle", widget: "text" }
          - { label: "Chiffre 1", name: "stat_1_value", widget: "string" }
          - { label: "Légende chiffre 1", name: "stat_1_label", widget: "string" }
          - { label: "Chiffre 2", name: "stat_2_value", widget: "string" }
          - { label: "Légende chiffre 2", name: "stat_2_label", widget: "string" }
          - { label: "Chiffre 3", name: "stat_3_value", widget: "string" }
          - { label: "Légende chiffre 3", name: "stat_3_label", widget: "string" }
          - { label: "Chiffre 4", name: "stat_4_value", widget: "string" }
          - { label: "Légende chiffre 4", name: "stat_4_label", widget: "string" }
          - { label: "Téléphone 1", name: "phone_1", widget: "string" }
          - { label: "Téléphone 2", name: "phone_2", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Localisation", name: "location", widget: "string" }
          - { label: "Numéro WhatsApp (sans le +, ex: 22666603024)", name: "whatsapp_number", widget: "string" }
          - { label: "Lien TikTok", name: "tiktok_url", widget: "string" }
          - { label: "Lien Facebook", name: "facebook_url", widget: "string" }

  - name: "photos"
    label: "Photos du site"
    files:
      - file: "content/photos-info.json"
        label: "Bibliotheque de photos (upload uniquement)"
        name: "photos"
        fields:
          - label: "Photo du hero (page d'accueil)"
            name: "hero_photo"
            widget: "image"
            media_library:
              config:
                multiple: false

  - name: "services"
    label: "Page Nos Services"
    files:
      - file: "content/services.json"
        label: "Contenu de la page Services"
        name: "services"
        fields:
          - { label: "Accroche du haut de page", name: "hero_kicker", widget: "string" }
          - { label: "Titre de la page", name: "hero_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "hero_sub", widget: "text" }
          - label: "Poles de services"
            name: "poles"
            widget: "list"
            fields:
              - { label: "Identifiant (ne pas modifier)", name: "id", widget: "string" }
              - { label: "Numero et nom (ex: 01 · Mecanique)", name: "kicker", widget: "string" }
              - { label: "Titre de la section", name: "title", widget: "string" }
              - { label: "Texte d'introduction", name: "lead", widget: "text" }
              - { label: "Photo de fond (laisser vide si aucune)", name: "background", widget: "string", required: false }
              - label: "Cartes de ce pole"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Titre de la carte", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
                  - { label: "Mots-cles (separes par des virgules)", name: "tags", widget: "string" }
                  - label: "Photo"
                    name: "photo"
                    widget: "image"
                    media_library:
                      config:
                        multiple: false

  - name: "pourquoi"
    label: "Page Pourquoi nous choisir"
    files:
      - file: "content/pourquoi.json"
        label: "Contenu de la page Pourquoi nous choisir"
        name: "pourquoi"
        fields:
          - { label: "Accroche du haut de page", name: "hero_kicker", widget: "string" }
          - { label: "Titre de la page", name: "hero_title", widget: "string" }
          - { label: "Sous-titre de la page", name: "hero_sub", widget: "text" }
          - label: "Points forts"
            name: "points"
            widget: "list"
            fields:
              - label: "Icone"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Certification", value: "cert" }
                  - { label: "Horloge", value: "clock" }
                  - { label: "Carte", value: "map" }
                  - { label: "Maison", value: "home" }
                  - { label: "Diplome", value: "grad" }
                  - { label: "Coche", value: "check" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - { label: "Accroche section equipe", name: "team_kicker", widget: "string" }
          - { label: "Titre section equipe", name: "team_title", widget: "string" }
          - label: "Membres de l'equipe presentes"
            name: "team"
            widget: "list"
            fields:
              - label: "Photo"
                name: "photo"
                widget: "image"
                media_library:
                  config:
                    multiple: false
              - { label: "Role / intitule", name: "role", widget: "string" }
              - { label: "Description", name: "text", widget: "text" }

  - name: "actus"
    label: "Actus (articles)"
    folder: "content/actus"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre de l'article", name: "title", widget: "string" }
      - { label: "Date de publication", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Resume (affiche sur la liste des actus)", name: "excerpt", widget: "text" }
      - label: "Photo (optionnelle)"
        name: "image"
        widget: "image"
        required: false
        media_library:
          config:
            multiple: false
      - label: "Texte de l'article"
        name: "body"
        widget: "text"
        hint: "Separez les paragraphes par une ligne vide."
